<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand" aria-label="GOLAZO - inicio">
      <span class="brand-ball">⚽</span><span class="brand-text">GOLAZO</span>
    </a>

    <nav class="topnav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Partidos</a>
      <a routerLink="/equipos" routerLinkActive="active">Equipos</a>
    </nav>

    <div class="topbar-user">
      @if (auth.isLoggedIn()) {
        @if (auth.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active" class="btn btn-ghost btn-sm">Admin</a>
        }
        <a routerLink="/perfil" routerLinkActive="active" class="btn btn-ghost btn-sm">
          👤 {{ auth.user()?.username ?? 'Mi cuenta' }}
        </a>
        <button type="button" class="btn btn-outline btn-sm" (click)="logout()">Salir</button>
      } @else {
        <a routerLink="/login" class="btn btn-ghost btn-sm">Ingresar</a>
        <a routerLink="/registro" class="btn btn-primary btn-sm">Registrarme</a>
      }
    </div>
  </div>
</header>
