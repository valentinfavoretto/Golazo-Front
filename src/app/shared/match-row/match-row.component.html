<div
  class="match-row"
  [class.clickable]="!!match()._id"
  [class.is-live]="match().status === 'live'"
  (click)="open()"
>
  <div class="mr-status" [class.live]="match().status === 'live'">
    {{ match() | matchStatus: showDate() }}
  </div>

  <div class="mr-team mr-home">
    <span class="mr-name">{{ match().homeTeam }}</span>
    <img appImgFallback class="logo" [src]="match().homeLogo" [alt]="match().homeTeam" loading="lazy" />
  </div>

  <div class="mr-score">
    @if (hasScore()) {
      <span>{{ match().homeScore }}</span>
      <span class="dash">–</span>
      <span>{{ match().awayScore }}</span>
    } @else {
      <span class="dash">–</span>
    }
  </div>

  <div class="mr-team mr-away">
    <img appImgFallback class="logo" [src]="match().awayLogo" [alt]="match().awayTeam" loading="lazy" />
    <span class="mr-name">{{ match().awayTeam }}</span>
  </div>

  <div class="mr-fav">
    @if (canFavorite()) {
      <button
        type="button"
        class="star"
        [class.on]="isFav()"
        [title]="isFav() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        (click)="toggleFavorite($event)"
      >
        {{ isFav() ? '★' : '☆' }}
      </button>
    }
  </div>
</div>
