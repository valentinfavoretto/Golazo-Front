<section class="card auth-card">
  <h1 class="card-title big-title">Crear cuenta</h1>

  <form (ngSubmit)="submit()" class="form-stack">
    <label>
      Usuario
      <input type="text" class="input" name="username" [(ngModel)]="username" autocomplete="username" required />
      <small class="muted">3 a 30 caracteres: letras, números y guion bajo.</small>
    </label>
    <label>
      Email
      <input type="email" class="input" name="email" [(ngModel)]="email" autocomplete="email" required />
    </label>
    <label>
      Contraseña
      <input
        type="password"
        class="input"
        name="password"
        [(ngModel)]="password"
        autocomplete="new-password"
        required
      />
      <small class="muted">Mínimo 8 caracteres, con al menos una letra y un número.</small>
    </label>
    <label>
      Repetir contraseña
      <input
        type="password"
        class="input"
        name="confirm"
        [(ngModel)]="confirm"
        autocomplete="new-password"
        required
      />
    </label>

    @if (error()) {
      <p class="msg err">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta…' : 'Registrarme' }}
    </button>
  </form>

  <p class="muted small center">
    ¿Ya tenés cuenta? <a routerLink="/login">Ingresar</a>
  </p>
</section>
