<aside class="sidebar">
  <h2 class="side-title">COMPETICIONES</h2>
  <ul class="side-list">
    @for (l of leagues; track l.id) {
      <li>
        <a [routerLink]="['/liga', l.id]" routerLinkActive="active" class="side-link">
          <img appImgFallback class="side-logo" [src]="logo(l.id)" [alt]="l.name" loading="lazy" />
          <span class="side-name">{{ l.name }}</span>
        </a>
      </li>
    }
  </ul>
</aside>
